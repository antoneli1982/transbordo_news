name: Verificar autenticação do Transbordo
on:
  push:
    branches: [seguranca-autenticacao]
  pull_request:
    paths: ['auth/**', 'firestore.rules', 'storage.rules', 'index.html', 'offline-sw.js', 'qa/**']
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências de teste
        run: npm install --no-save --no-audit --no-fund firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@13.35.1
      - name: Testar em projeto local isolado
        run: npx --no-install firebase emulators:exec --only firestore --project demo-transbordo 'node --experimental-default-type=module --test qa/access.test.mjs'
